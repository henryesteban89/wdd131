<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Customer Reviews - Henry's Auto Repair">
  <meta name="author" content="Henry Esteban">
  <title>Reviews - Henry's Auto Repair</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700&family=Open+Sans&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="styles/reviews.css">
</head>
<body>
  <!-- Header & Navigation -->
  <header>
    <div class="logo">
      <img src="images/site-logo.jpg" alt="Auto Repair Logo">
      <h1>Henry's Auto Repair</h1>
    </div>

    <!-- Hamburger button -->
    <button id="menu" aria-label="Toggle Menu">☰</button>

    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="reviews.html">Reviews</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
    </nav>
  </header>

  <!-- Banner -->
  <section class="banner">
    <img src="images/reviews-banner.jpg" alt="Customer feedback banner">
    <a href="contact.html" class="btn">Book Appointment</a>
  </section>

  <!-- Main Content -->
  <main>
    <section class="reviews">
      <h2>Customer Reviews</h2>
      <p>We value your feedback! Share your experience with Henry’s Auto Repair.</p>

      <!-- Review Form -->
      <form id="reviewForm" action="#" method="post">
        <label for="product">Service:</label>
        <select id="product" name="product" required>
          <option value="" disabled selected>Select a Service...</option>
          <option value="engine">Engine Diagnostics & Repair</option>
          <option value="brakes">Brake Services</option>
          <option value="oil">Oil Changes & Maintenance</option>
          <option value="transmission">Transmission Repair</option>
          <option value="suspension">Suspension & Steering</option>
          <option value="tires">Tire Services</option>
          <option value="electrical">Electrical System Repair</option>
          <option value="ac">Air Conditioning & Heating</option>
        </select>

        <fieldset>
          <legend>Overall Rating:</legend>
          <label><input type="radio" name="rating" value="1" required> ☆</label>
          <label><input type="radio" name="rating" value="2"> ☆☆</label>
          <label><input type="radio" name="rating" value="3"> ☆☆☆</label>
          <label><input type="radio" name="rating" value="4"> ☆☆☆☆</label>
          <label><input type="radio" name="rating" value="5"> ☆☆☆☆☆</label>
        </fieldset>

        <label for="review">Written Review:</label>
        <textarea id="review" name="review" rows="5" required></textarea>

        <label for="username">Your Name:</label>
        <input type="text" id="username" name="username" required>

        <button type="submit" class="btn">Submit Review</button>
      </form>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 Henry's Auto Repair | WDD 131 Final Project</p>
    <a href="references.html">References</a>
  </footer>

  <!-- JavaScript -->
  <script src="scripts/reviews.js"></script>
</body>
</html>
