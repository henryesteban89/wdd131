<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lazy Load Example</title>
  <link rel="stylesheet" href="styles/lazyload.css">
  <script src="scripts/lazyload.js" defer></script>
</head>
<body>
  <main>
    <h1>Lazy Loading Images</h1>

    <!-- Six portrait images -->
    <img src="images/auto-1.jpg" alt="Image 1" width="400" height="600" loading="lazy">
    <img src="images/auto-2.jpg" alt="Image 2" width="400" height="600" loading="lazy">
    <img src="images/auto-3.jpg" alt="Image 3" width="400" height="600" loading="lazy">
    <img src="images/auto-4.jpg" alt="Image 4" width="400" height="600" loading="lazy">
    <img src="images/auto-5.jpg" alt="Image 5" width="400" height="600" loading="lazy">
    <img src="images/auto-6.jpg" alt="Image 6" width="400" height="600" loading="lazy">
  </main>

  <footer>
    <p>&copy; <span id="currentyear"></span> Henry – Guatemala</p>
    <p id="lastModified"></p>
  </footer>
</body>
</html>
